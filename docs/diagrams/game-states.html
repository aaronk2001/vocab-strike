<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Strike game states</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · Diagram Design</p>
    <h1>Vocab Strike game states</h1>

    <!-- Replace game-states with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="game-states-title game-states-desc">
        <title id="game-states-title">Vocab Strike game states</title>
        <desc id="game-states-desc">State machine of a Vocab Strike run: Menu starts Defend, a cleared wave moves to Decode, finished definitions start the next wave, and hull zero ends the run at Game over.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <g transform="translate(0,-60)">
        <!-- Transitions (drawn first) -->
        <line x1="58" y1="248" x2="88" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="240" y1="248" x2="392" y2="248" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="592" y1="248" x2="752" y2="248" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <path d="M 836 200 V 152 A 8 8 0 0 0 828 144 H 500 A 8 8 0 0 0 492 152 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <line x1="460" y1="296" x2="460" y2="420" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <line x1="524" y1="420" x2="524" y2="296" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 392 468 H 172 A 8 8 0 0 1 164 460 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- Transition labels (event above, [guard] / action below) -->
        <rect x="298" y="228" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="316" y="237" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ENTER</text>
        <rect x="284" y="256" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="316" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">/ WAVE = 1</text>
        <rect x="640" y="228" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="237" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAVE CLEAR</text>
        <rect x="637" y="256" width="70" height="12" rx="2" fill="#f5f5f5"/>
        <text x="672" y="265" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">[SHIPS = 0]</text>
        <rect x="635" y="124" width="58" height="12" rx="2" fill="#f5f5f5"/>
        <text x="664" y="133" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NEXT WAVE</text>
        <rect x="623.5" y="152" width="81" height="12" rx="2" fill="#f5f5f5"/>
        <text x="664" y="161" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">[QUEUE EMPTY]</text>
        <rect x="388" y="336" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="448" y="345" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">SHIP LANDS</text>
        <rect x="388" y="352" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="448" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">[HULL = 0]</text>
        <rect x="532" y="352" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="536" y="361" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.08em">ENTER</text>
        <rect x="269.5" y="448" width="25" height="12" rx="2" fill="#f5f5f5"/>
        <text x="282" y="457" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ESC</text>
        <!-- Annotation: pause overlay -->
        <path d="M 836 404 Q 828 350 836 304" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="836" cy="302" r="2" fill="#2d3142"/>
        <text x="920" y="424" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Esc pauses Defend or Decode,</text>
        <text x="920" y="442" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Q from pause quits to Menu.</text>
        <circle cx="52" cy="248" r="6" fill="#2d3142"/>
        <!-- States -->
        <rect x="88" y="200" width="152" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="96" y="208" width="40" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="116" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="164" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Menu</text>
        <text x="164" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pick deck + level</text>
        <text x="164" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Enter starts a run</text>
        <rect x="392" y="200" width="200" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="400" y="208" width="40" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="420" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="492" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Defend</text>
        <text x="492" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">type term, ship dies</text>
        <text x="492" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ship lands, hull -1</text>
        <rect x="752" y="200" width="168" height="96" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="760" y="208" width="40" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="780" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="836" y="246" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decode</text>
        <text x="836" y="264" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">type each definition</text>
        <text x="836" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">timer runs, Enter skips</text>
        <rect x="392" y="420" width="200" height="96" rx="8" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="400" y="428" width="40" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="420" y="437" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
        <text x="492" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Game over</text>
        <text x="492" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hull reached 0</text>
        <text x="492" y="498" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">score, WPM, personal best</text>
        </g>
        <!-- Legend strip -->
        <line x1="40" y1="544" x2="920" y2="544" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <circle cx="124" cy="561" r="4" fill="#2d3142"/>
        <text x="134" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">INITIAL</text>
        <rect x="212" y="556" width="18" height="10" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="238" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">STATE</text>
        <rect x="296" y="556" width="18" height="10" rx="3" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="322" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">RUN ENDS</text>
        <line x1="404" y1="561" x2="426" y2="561" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="434" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TRANSITION</text>
        <line x1="540" y1="561" x2="562" y2="561" stroke="#eb6c36" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
        <text x="570" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">CORE: TYPE TERM, THEN DEFINITION</text>
        <line x1="796" y1="561" x2="818" y2="561" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="826" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">RETURN</text>

      </svg>
    </div>
  </div>
</body>
</html>
